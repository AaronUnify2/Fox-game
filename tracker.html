<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Echoes — Chiptune Studio</title>
    <link rel="stylesheet" href="tracker.css">
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <button class="icon-btn" id="sidebarToggle" title="Toggle panel">☰</button>
            <button class="song-title" id="songTitle">Untitled</button>
        </div>

        <div class="header-center">
            <button class="transport-btn" id="playBtn" title="Play / Stop">▶</button>
            <button class="toggle-chip" id="loopPatternBtn" title="Loop the current pattern while editing">Loop pattern</button>
        </div>

        <div class="header-right">
            <label class="tempo">BPM
                <input type="number" id="tempoInput" min="40" max="280" step="1" value="120">
            </label>
            <button class="ghost-btn" id="importBtn">Import</button>
            <button class="primary-btn" id="exportBtn">Export</button>
            <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>
    </header>

    <!-- Main -->
    <div class="main-area">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <!-- Song switcher -->
            <div class="panel">
                <div class="panel-title">Song</div>
                <div class="song-switch">
                    <select id="songSelect"></select>
                    <button class="ghost-btn sm" id="newSongBtn">New</button>
                </div>
            </div>

            <!-- Channels -->
            <div class="panel">
                <div class="panel-title">Channels</div>
                <div class="channel-list" id="channelList"></div>
            </div>

            <!-- Patterns -->
            <div class="panel">
                <div class="panel-title">
                    Patterns
                    <span class="panel-actions">
                        <button class="ghost-btn sm" id="addPatternBtn">+ Add</button>
                        <button class="ghost-btn sm" id="dupPatternBtn">Dup</button>
                        <button class="ghost-btn sm danger" id="delPatternBtn">Del</button>
                    </span>
                </div>
                <div class="chip-row" id="patternList"></div>
            </div>

            <!-- Order -->
            <div class="panel">
                <div class="panel-title">
                    Order
                    <span class="panel-actions">
                        <button class="ghost-btn sm" id="orderAddBtn">+ Append</button>
                        <button class="ghost-btn sm" id="orderRemoveBtn">Remove</button>
                    </span>
                </div>
                <div class="chip-row" id="orderList"></div>
                <label class="loop-row">
                    <input type="checkbox" id="loopSongChk" checked> Loop song
                </label>
            </div>
        </aside>

        <!-- Canvas -->
        <div class="canvas-container">
            <div class="canvas-bar">
                <span class="editing-label">Editing:
                    <b id="editingChannel">Melody</b> ·
                    pattern <b id="editingPattern">A</b>
                </span>
                <span class="hint" id="chordHint">Tip: tap multiple rows in one column for a chord</span>
                <span class="octave-ctrl" id="octaveCtrl">
                    <button class="ghost-btn sm" id="octDown">Oct −</button>
                    <button class="ghost-btn sm" id="octUp">Oct +</button>
                </span>
            </div>
            <div class="grid-wrap" id="gridWrap">
                <div class="grid" id="grid"></div>
            </div>
        </div>
    </div>

    <!-- Channel settings modal -->
    <div class="modal" id="channelModal">
        <div class="modal-content">
            <div class="modal-title" id="channelModalTitle">Channel</div>

            <!-- Instrument -->
            <div class="form-group">
                <label>Instrument</label>
                <div class="seg seg-wrap" id="instrumentSeg">
                    <button data-type="pulse">Pulse</button>
                    <button data-type="triangle">Triangle</button>
                    <button data-type="bell">Bell</button>
                    <button data-type="strings">Strings</button>
                    <button data-type="choir">Choir</button>
                    <button data-type="noise">Drums</button>
                </div>
            </div>

            <!-- Pulse: duty -->
            <div class="form-group" id="dutyGroup">
                <label>Duty cycle (pulse tone)</label>
                <div class="seg" id="dutySeg">
                    <button data-duty="0.125">12.5%</button>
                    <button data-duty="0.25">25%</button>
                    <button data-duty="0.5">50%</button>
                    <button data-duty="0.75">75%</button>
                </div>
            </div>

            <!-- Bell: ring-out -->
            <div class="form-group" id="bellDecayGroup">
                <label>Bell ring-out <span id="bellDecayVal">1.3</span>×</label>
                <input type="range" id="bellDecayRange" min="0.4" max="2.5" step="0.1" value="1.3">
            </div>

            <!-- Strings -->
            <div class="form-group" id="strAttackGroup">
                <label>Strings attack <span id="strAttackVal">0.06</span>s</label>
                <input type="range" id="strAttackRange" min="0.01" max="0.40" step="0.01" value="0.06">
            </div>
            <div class="form-group" id="strReleaseGroup">
                <label>Strings release <span id="strReleaseVal">0.40</span>s</label>
                <input type="range" id="strReleaseRange" min="0.10" max="1.20" step="0.05" value="0.40">
            </div>
            <div class="form-group" id="strDetuneGroup">
                <label>Ensemble detune <span id="strDetuneVal">8</span>¢</label>
                <input type="range" id="strDetuneRange" min="0" max="20" step="1" value="8">
            </div>

            <!-- Choir -->
            <div class="form-group" id="choVowelGroup">
                <label>Choir vowel</label>
                <div class="seg" id="vowelSeg">
                    <button data-vowel="ah">Ah</button>
                    <button data-vowel="oo">Oo</button>
                    <button data-vowel="ee">Ee</button>
                </div>
            </div>
            <div class="form-group" id="choAttackGroup">
                <label>Choir attack <span id="choAttackVal">0.07</span>s</label>
                <input type="range" id="choAttackRange" min="0.01" max="0.40" step="0.01" value="0.07">
            </div>
            <div class="form-group" id="choReleaseGroup">
                <label>Choir release <span id="choReleaseVal">0.50</span>s</label>
                <input type="range" id="choReleaseRange" min="0.10" max="1.20" step="0.05" value="0.50">
            </div>

            <!-- Volume (always) -->
            <div class="form-group">
                <label>Volume <span id="volVal">0.80</span></label>
                <input type="range" id="volRange" min="0" max="1" step="0.05" value="0.8">
            </div>

            <div class="button-group">
                <button class="secondary" id="channelModalClose">Done</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module" src="tracker.js"></script>
</body>
</html>
